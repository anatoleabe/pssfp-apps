; Limites d'envoi de PHP-FPM, à déposer dans /etc/php/8.3/fpm/conf.d/.
; Sans ce fichier, PHP garde 2 Mo par fichier : les formulaires qui annoncent
; davantage échouent avec « validation.uploaded ».
; post_max_size reste aligné sur client_max_body_size (12m) de api.pssfp.org.
upload_max_filesize = 10M
post_max_size = 12M
