# =============================================================================
# candidature.pfinancespubliques.org — redirection vers le portail de candidature
#
# POURQUOI UNE REDIRECTION ET NON UN ALIAS
#
# La tentation est d'ajouter ce nom au `server_name` de apply.pssfp.org pour
# servir la même application sur les deux domaines. Ce serait une panne
# silencieuse : les cookies de session sont rattachés à `.pssfp.org`
# (SESSION_DOMAIN côté Laravel, `domain: '.pssfp.org'` côté Next), et un
# navigateur refuse un cookie dont le domaine ne correspond pas à l'hôte de la
# page. Un candidat arrivant par pfinancespubliques.org consulterait les pages
# publiques mais ne pourrait jamais rester connecté.
#
# Servir réellement l'application sur ce domaine supposerait de rendre le
# domaine des cookies dynamique, d'ajouter l'hôte à SANCTUM_STATEFUL_DOMAINS et
# de revoir la balise canonique. À trancher hors campagne.
#
# PRÉREQUIS AVANT ACTIVATION
#
#  1. Cloudflare : supprimer l'enregistrement A `candidature` hérité de
#     l'ancien hébergeur (162.210.96.128), puis créer le CNAME vers
#     apply.pssfp.org. Cloudflare refuse un CNAME tant qu'un A existe sur le
#     même nom.
#  2. Certificat : le bloc 443 exige un certificat couvrant ce nom. L'obtenir
#     en étendant celui d'apply plutôt qu'en créant un second :
#       certbot --nginx -d apply.pssfp.org -d candidature.pfinancespubliques.org \
#               --expand --cert-name apply.pssfp.org
#     Le défi HTTP-01 passe par le bloc 80 ci-dessous, qui laisse
#     /.well-known/acme-challenge/ accessible avant la redirection.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name candidature.pfinancespubliques.org;

    # Laisser passer le renouvellement Let's Encrypt avant toute redirection.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://apply.pssfp.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name candidature.pfinancespubliques.org;

    # Certificat mutualisé avec apply.pssfp.org (option --expand ci-dessus).
    ssl_certificate /etc/letsencrypt/live/apply.pssfp.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apply.pssfp.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/candidature.pfinancespubliques.org.access.log;
    error_log /var/log/nginx/candidature.pfinancespubliques.org.error.log;

    # 301 et non 302 : la redirection est définitive, les moteurs doivent
    # transférer le référencement de l'ancien domaine vers apply.pssfp.org.
    # `$request_uri` conserve le chemin et la chaîne de requête, pour qu'un lien
    # profond diffusé sous l'ancien domaine continue d'aboutir au bon endroit.
    return 301 https://apply.pssfp.org$request_uri;
}
