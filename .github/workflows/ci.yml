name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ===========================================================================
  # Parties modifiées : chaque job ne tourne que si son application change
  # (le backend seul prenait 40 min et retenait les PR du portail).
  # ===========================================================================
  changes:
    name: Parties modifiées
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filtre.outputs.backend }}
      apps: ${{ steps.apps.outputs.liste }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Détecter les parties modifiées
        id: filtre
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            commun: &commun
              - '.github/workflows/ci.yml'
            backend:
              - *commun
              - 'backend/**'
            frontend:
              - *commun
              - 'frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            library:
              - *commun
              - 'library/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            candidature:
              - *commun
              - 'candidature/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

      - name: Applications Next.js à tester
        id: apps
        env:
          CHANGEMENTS: ${{ steps.filtre.outputs.changes }}
        run: echo "liste=$(jq -c '[.[] | select(. == "frontend" or . == "library" or . == "candidature")]' <<< "$CHANGEMENTS")" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Backend Laravel
  # ===========================================================================
  backend:
    name: Backend (Laravel + Pest) — ${{ matrix.lot }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # Runners à 2 processeurs : paralléliser sur une machine ne gagne rien (PHP et
    # PostgreSQL les occupent déjà). La suite est répartie sur 4 machines.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lot: filament
            chemins: tests/Feature/Filament
          - lot: candidatures-lmd
            chemins: tests/Feature/Applications tests/Feature/Lmd
          - lot: bibliotheque-unitaires
            chemins: tests/Feature/Library tests/Unit
          # Tout le reste, calculé : un nouveau dossier de tests n'est jamais oublié.
          - lot: reste
            chemins: ''

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pssfp_admin
          POSTGRES_PASSWORD: pssfp_test_password
          POSTGRES_DB: pssfp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pssfp_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.7
        env:
          MEILI_MASTER_KEY: test_master_key
          MEILI_NO_ANALYTICS: "true"
          MEILI_ENV: development
        ports:
          - 7700:7700

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, gd, intl, bcmath, zip
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env.testing
        working-directory: backend
        run: cp .env.testing.example .env.testing 2>/dev/null || cp .env.example .env.testing

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate --env=testing

      - name: Run migrations
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pssfp_test
          DB_USERNAME: pssfp_admin
          DB_PASSWORD: pssfp_test_password
        run: php artisan migrate --env=testing --force

      - name: Run Pest tests (${{ matrix.lot }})
        working-directory: backend
        # Tests bibliothèque contre le service Meilisearch ci-dessus (index préfixé test_),
        # propre à chaque machine.
        env:
          MEILISEARCH_HOST: http://127.0.0.1:7700
          MEILISEARCH_KEY: test_master_key
          CHEMINS: ${{ matrix.chemins }}
        run: |
          if [ -n "$CHEMINS" ]; then
            ./vendor/bin/pest $CHEMINS
          else
            ./vendor/bin/pest $(find tests -name '*Test.php' | grep -vE '^tests/(Feature/(Filament|Applications|Lmd|Library)|Unit)/' | sort)
          fi

      - name: Lint with Pint
        if: matrix.lot == 'reste'
        working-directory: backend
        run: ./vendor/bin/pint --test

  # ===========================================================================
  # Frontends Next.js (matrix)
  # ===========================================================================
  frontends:
    name: ${{ matrix.app }} (Next.js + Playwright)
    needs: changes
    if: needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: pnpm lint

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: pnpm tsc --noEmit

      - name: Build
        working-directory: ${{ matrix.app }}
        # next/font télécharge les polices Google au build : depuis les runners, le
        # téléchargement échoue parfois (« Cannot read properties of null (reading '1') »).
        # Une relance suffit ; un vrai défaut de compilation échoue deux fois.
        run: pnpm build || { echo "::warning::Build relancé après un échec (polices Google ?)"; sleep 20; pnpm build; }

      - name: Install Playwright browsers
        working-directory: ${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ${{ matrix.app }}
        run: pnpm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: ${{ matrix.app }}/playwright-report/
          retention-days: 7
